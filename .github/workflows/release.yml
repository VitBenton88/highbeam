name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Trusted publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest
      - name: Check tag matches package version
        run: |
          test "v$(npm pkg get version | tr -d '"')" = "$GITHUB_REF_NAME" \
            || { echo "Tag $GITHUB_REF_NAME != package version"; exit 1; }
      - run: npm ci
      - run: npm run build
      # Full suite (incl. real-browser tests) gates every push on main in ci.yml;
      # the release run just re-checks the unit layer before publishing.
      - run: npx vitest run --project unit
      - run: npm publish
